name: test

on:
  push:
    branches:
      - phonemic-reasoning-engine
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Run dependency-free tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_*.py' -v
